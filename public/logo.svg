<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradient chính cho vòng chữ Q -->
    <linearGradient id="qRingGrad" x1="14" y1="106" x2="96" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Gradient sáng cho đuôi chữ Q và dải lượn -->
    <linearGradient id="qAccentGrad" x1="30" y1="90" x2="105" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <!-- Gradient cho mũi tên tốc độ -->
    <linearGradient id="arrowGrad" x1="54" y1="74" x2="104" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Vòng chữ Q chính (Cắt khe mở ở góc trên phải cho mũi tên lao ra) -->
  <path d="M89.5 63.5C88.2 80.6 73.9 94 56.5 94C38.3 94 23.5 79.2 23.5 61C23.5 42.8 38.3 28 56.5 28C65.2 28 73.1 31.4 79 36.9" stroke="url(#qRingGrad)" stroke-width="15" stroke-linecap="round" />

  <!-- Dải lượn tạo chiều sâu bên trong chữ Q + Đuôi chữ Q vẩy sang phải -->
  <path d="M36 87.5C46 95.5 61 97.5 74.5 91.5C81.5 97.5 89.5 101 98 99.5" stroke="url(#qAccentGrad)" stroke-width="11" stroke-linecap="round" />

  <!-- Số 1 (One) vững chãi ở tâm chữ Q -->
  <path d="M44 49.5L55.5 40H62V82H50.5V52.5L44 57.5V49.5Z" fill="#059669" />

  <!-- Mũi tên tốc độ (Quick) vút lên góc phải trên -->
  <path d="M54 73L90 31L80 27L105 17L98 42L94 32L54 73Z" fill="url(#arrowGrad)" />
</svg>