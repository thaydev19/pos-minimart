<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Minimart fresh green plastic bag gradient -->
    <linearGradient id="bagGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="bagDropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="44" ry="9" fill="#064E3B" opacity="0.18"/>

  <g filter="url(#bagDropShadow)">
    <!-- T-shirt Handle Shopping Bag Shape -->
    <!-- Main Body & Handles combined path -->
    <path d="M 64 36 
             L 78 36 
             L 78 72 
             C 78 76, 82 80, 86 80 
             L 114 80 
             C 118 80, 122 76, 122 72 
             L 122 36 
             L 136 36 
             C 142 36, 148 44, 146 56 
             L 144 165 
             C 144 172, 138 174, 132 174 
             L 68 174 
             C 62 174, 56 172, 56 165 
             L 54 56 
             C 52 44, 58 36, 64 36 Z" 
          fill="url(#bagGreen)"/>

    <!-- Handle Cut-out openings (Die-cut strap visual) -->
    <path d="M 66 42 L 74 42 L 74 65 L 66 65 Z" fill="#F8F9FA" opacity="0.3"/>
    <path d="M 126 42 L 134 42 L 134 65 L 126 65 Z" fill="#F8F9FA" opacity="0.3"/>

    <!-- Plastic Bag Side Folds / Pleats -->
    <path d="M 54 56 L 68 90 L 68 170" stroke="#047857" stroke-width="1.5" fill="none"/>
    <path d="M 144 56 L 132 90 L 132 170" stroke="#047857" stroke-width="1.5" fill="none"/>

    <!-- Center White Retail Minimart Logo -->
    <circle cx="100" cy="120" r="22" fill="#FFFFFF"/>
    <circle cx="100" cy="120" r="19" fill="#059669"/>

    <!-- Shopping Cart Icon in Center -->
    <g transform="translate(89, 108)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="4" cy="18" r="1.5" fill="#FFFFFF"/>
      <circle cx="16" cy="18" r="1.5" fill="#FFFFFF"/>
      <path d="M 1 2 L 4 2 L 6.5 14 L 17 14 L 19 6 L 5.5 6"/>
    </g>

    <!-- Minimart Lao text -->
    <text x="100" y="152" font-family="'Noto Sans Lao', Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#FFFFFF" text-anchor="middle">ມິນິມາດ ລາວຈະເລີນ</text>
    <text x="100" y="160" font-family="Arial, sans-serif" font-weight="bold" font-size="4.5" fill="#A7F3D0" text-anchor="middle">ECO-FRIENDLY BAG</text>

    <!-- Plastic Crinkle Highlights -->
    <path d="M 64 80 Q 76 120 72 160" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>

