<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Translucent crystal ice gradient -->
    <linearGradient id="iceCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="80%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bagPlastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#F0F9FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="iceShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground shadow / water condensation pool -->
  <ellipse cx="100" cy="182" rx="46" ry="9" fill="#0284C7" opacity="0.2"/>

  <g filter="url(#iceShadow)">
    <!-- Clear plastic bag tied at neck -->
    <path d="M 94 38 L 106 38 L 104 48 L 96 48 Z" fill="#0284C7"/>
    <!-- Red/Blue Twist Tie Ribbon -->
    <rect x="92" y="44" width="16" height="5" rx="2" fill="#DC2626"/>

    <!-- Bag Main Body -->
    <path d="M 96 48 
             C 80 54, 54 85, 54 135 
             C 54 170, 70 176, 100 176 
             C 130 176, 146 170, 146 135 
             C 146 85, 120 54, 104 48 Z" 
          fill="url(#bagPlastic)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Cylindrical Tube Ice Cubes with hollow centers visible inside bag -->
    <!-- Cube 1 (Center) -->
    <g transform="translate(85, 120)">
      <polygon points="15,0 30,8 30,26 15,34 0,26 0,8" fill="url(#iceCube)" stroke="#0284C7" stroke-width="1.5"/>
      <ellipse cx="15" cy="8" rx="8" ry="4" fill="#0284C7" opacity="0.4"/>
      <line x1="15" y1="34" x2="15" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Cube 2 (Left) -->
    <g transform="translate(62, 105) rotate(-15)">
      <polygon points="13,0 26,7 26,22 13,29 0,22 0,7" fill="url(#iceCube)" stroke="#0284C7" stroke-width="1.5"/>
      <ellipse cx="13" cy="7" rx="6.5" ry="3.5" fill="#0284C7" opacity="0.4"/>
    </g>

    <!-- Cube 3 (Right) -->
    <g transform="translate(108, 108) rotate(18)">
      <polygon points="13,0 26,7 26,22 13,29 0,22 0,7" fill="url(#iceCube)" stroke="#0284C7" stroke-width="1.5"/>
      <ellipse cx="13" cy="7" rx="6.5" ry="3.5" fill="#0284C7" opacity="0.4"/>
    </g>

    <!-- Cube 4 (Top Stacked) -->
    <g transform="translate(86, 80) rotate(5)">
      <polygon points="14,0 28,7 28,24 14,31 0,24 0,7" fill="url(#iceCube)" stroke="#0284C7" stroke-width="1.5"/>
      <ellipse cx="14" cy="7" rx="7" ry="3.5" fill="#0284C7" opacity="0.4"/>
    </g>

    <!-- Crisp Snowflake Emblem -->
    <g transform="translate(100, 68)" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-7" y1="-4" x2="7" y2="4"/>
      <line x1="-7" y1="4" x2="7" y2="-4"/>
    </g>

    <!-- Clear Plastic Crinkles & Frost Mist -->
    <path d="M 64 90 Q 72 130 68 158" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>
    <path d="M 136 90 Q 128 130 132 158" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>

    <!-- Blue Label Badge -->
    <rect x="68" y="142" width="64" height="15" rx="3" fill="#0284C7"/>
    <text x="100" y="152.5" font-family="'Noto Sans Lao', Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#FFFFFF" text-anchor="middle">ນ້ຳກ້ອນອະນາໄມ</text>
  </g>
</svg>

