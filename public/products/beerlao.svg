<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Can metallic cylinder gradient -->
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29B38"/>
      <stop offset="25%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#FFE8A3"/>
      <stop offset="75%" stop-color="#E5BC50"/>
      <stop offset="100%" stop-color="#997520"/>
    </linearGradient>
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="greenBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="canShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient shadow under can -->
  <ellipse cx="100" cy="180" rx="42" ry="10" fill="#000000" opacity="0.18"/>

  <!-- Can Group -->
  <g filter="url(#canShadow)">
    <!-- Top Silver Rim Rim -->
    <ellipse cx="100" cy="36" rx="34" ry="7" fill="url(#silverRim)"/>
    <ellipse cx="100" cy="34" rx="27" ry="5" fill="#E2E8F0"/>
    <ellipse cx="100" cy="33" rx="16" ry="3" fill="#CBD5E1"/>
    <!-- Pull tab -->
    <rect x="96" y="30" width="8" height="6" rx="2" fill="#94A3B8"/>
    <circle cx="100" cy="33" r="1.5" fill="#64748B"/>

    <!-- Can Main Body -->
    <path d="M 66 38 L 134 38 L 134 162 A 34 8 0 0 1 66 162 Z" fill="url(#canBody)"/>

    <!-- Bottom Silver Base -->
    <path d="M 68 160 L 132 160 L 129 169 A 29 6 0 0 1 71 169 Z" fill="url(#silverRim)"/>

    <!-- Beerlao Signature Green Center Band -->
    <rect x="66" y="65" width="68" height="65" fill="url(#greenBand)"/>
    <!-- Gold accent stripes -->
    <line x1="66" y1="65" x2="134" y2="65" stroke="#FDE047" stroke-width="2"/>
    <line x1="66" y1="130" x2="134" y2="130" stroke="#FDE047" stroke-width="2"/>

    <!-- Center White/Gold Medallion -->
    <ellipse cx="100" cy="97" rx="28" ry="24" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
    <ellipse cx="100" cy="97" rx="25" ry="21" fill="#FEF3C7"/>

    <!-- Tiger / Star Emblem in Medallion -->
    <path d="M 100 81 L 102 86 L 107 86 L 103 89 L 105 94 L 100 91 L 95 94 L 97 89 L 93 86 L 98 86 Z" fill="#DC2626"/>

    <!-- Bold Beerlao Text -->
    <text x="100" y="103" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#064E3B" text-anchor="middle" letter-spacing="0.5">BEERLAO</text>
    <text x="100" y="112" font-family="'Noto Sans Lao', Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#B45309" text-anchor="middle">ເບຍລາວ</text>

    <!-- Top & Bottom text on can -->
    <text x="100" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#78350F" text-anchor="middle">LAGER BEER</text>
    <text x="100" y="148" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#78350F" text-anchor="middle">330 ml • Alc. 5%</text>

    <!-- Metallic reflection highlight -->
    <rect x="74" y="38" width="6" height="124" fill="#FFFFFF" opacity="0.35"/>
    <rect x="122" y="38" width="3" height="124" fill="#000000" opacity="0.12"/>
  </g>
</svg>

