<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Woven Bamboo Thip Khao Gradient -->
    <linearGradient id="bambooWeave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="20%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="riceShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="178" rx="48" ry="10" fill="#78350F" opacity="0.2"/>

  <g filter="url(#riceShadow)">
    <!-- Traditional Lao Woven Bamboo Basket: Thip Khao (ຕິບເຂົ້າ) -->
    
    <!-- Base Foot of Basket -->
    <path d="M 68 152 L 132 152 L 136 166 L 64 166 Z" fill="#78350F"/>
    <ellipse cx="100" cy="166" rx="36" ry="6" fill="#92400E"/>

    <!-- Main Cylinder Body of Basket -->
    <path d="M 54 94 L 146 94 L 140 152 L 60 152 Z" fill="url(#bambooWeave)"/>

    <!-- Woven geometric patterns on bamboo (Diamond zigzag) -->
    <path d="M 55 106 Q 100 112 145 106" stroke="#78350F" stroke-width="2" fill="none"/>
    <path d="M 57 122 Q 100 128 143 122" stroke="#78350F" stroke-width="2" fill="none"/>
    <path d="M 59 138 Q 100 144 141 138" stroke="#78350F" stroke-width="2" fill="none"/>
    <!-- Cross hatches -->
    <line x1="70" y1="96" x2="80" y2="152" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="90" y1="96" x2="100" y2="152" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="110" y1="96" x2="120" y2="152" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="130" y1="96" x2="135" y2="152" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Steaming mound of pure white sticky rice overflowing -->
    <path d="M 56 94 
             C 54 75, 70 54, 100 52 
             C 130 54, 146 75, 144 94 
             Z" 
          fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Rice grain texture & pearlescent highlights -->
    <ellipse cx="90" cy="74" rx="3.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="106" cy="72" rx="3.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="118" cy="82" rx="3.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="80" cy="84" rx="3.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="98" cy="85" rx="3.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="100" cy="64" rx="3" ry="1.5" fill="#FFFFFF"/>

    <!-- Fresh Green Banana Leaf Liner (ໃບຕອງ) tucked inside -->
    <path d="M 50 94 Q 44 80 58 78 Q 58 92 56 96 Z" fill="#15803D"/>
    <path d="M 144 94 Q 154 82 142 78 Q 140 90 142 96 Z" fill="#15803D"/>

    <!-- Golden Wheat / Paddy Rice Stalk -->
    <path d="M 125 40 Q 140 60 142 90" stroke="#CA8A04" stroke-width="2" fill="none"/>
    <ellipse cx="127" cy="42" rx="3" ry="2" fill="#FACC15" transform="rotate(-30 127 42)"/>
    <ellipse cx="132" cy="48" rx="3" ry="2" fill="#FACC15" transform="rotate(20 132 48)"/>
    <ellipse cx="135" cy="56" rx="3" ry="2" fill="#FACC15" transform="rotate(-30 135 56)"/>
    <ellipse cx="139" cy="66" rx="3" ry="2" fill="#FACC15" transform="rotate(20 139 66)"/>

    <!-- Steam swirls from warm sticky rice -->
    <path d="M 94 46 Q 90 36 96 30" stroke="#CBD5E1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 106 44 Q 112 34 104 28" stroke="#CBD5E1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- Lao Title Pill -->
    <rect x="74" y="112" width="52" height="15" rx="4" fill="#78350F" opacity="0.95"/>
    <text x="100" y="122.5" font-family="'Noto Sans Lao', Arial, sans-serif" font-weight="bold" font-size="7" fill="#FEF08A" text-anchor="middle">ເຂົ້າໜຽວລາວ</text>
  </g>
</svg>

