<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Tetra Pak box perspective gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="cartonShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="38" ry="9" fill="#0F172A" opacity="0.18"/>

  <g filter="url(#cartonShadow)">
    <!-- Top Fold of Tetra Pak -->
    <polygon points="68,52 132,52 128,42 72,42" fill="url(#boxTop)"/>
    <!-- Top seal ridge -->
    <rect x="70" y="39" width="60" height="4" rx="1" fill="#94A3B8"/>
    <!-- Straw Hole Tab -->
    <circle cx="118" cy="47" r="3.5" fill="#DC2626"/>
    <circle cx="118" cy="47" r="2" fill="#FEF2F2"/>

    <!-- Main Front Face of Carton -->
    <rect x="68" y="52" width="64" height="122" rx="2" fill="url(#boxFront)"/>

    <!-- Top White/Red Lactasoy Banner -->
    <path d="M 68 52 L 132 52 L 132 80 L 68 80 Z" fill="#FFFFFF"/>
    <!-- Red Oval Badge -->
    <ellipse cx="100" cy="66" rx="22" ry="11" fill="#DC2626"/>
    <text x="100" y="70" font-family="'Brush Script MT', cursive, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle" font-style="italic">Lactasoy</text>

    <!-- Lao Script Subtitle -->
    <text x="100" y="93" font-family="'Noto Sans Lao', Arial, sans-serif" font-weight="bold" font-size="7" fill="#FEF08A" text-anchor="middle">ແລັກຕາຊອຍ</text>
    <text x="100" y="103" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#FFFFFF" text-anchor="middle">SOYMILK</text>

    <!-- Golden Soybean Pod & Drops Illustration -->
    <circle cx="100" cy="124" r="16" fill="#FFFFFF" opacity="0.15"/>
    <!-- Splash drops -->
    <path d="M 94 126 C 94 121, 98 116, 100 112 C 102 116, 106 121, 106 126 C 106 130, 103 133, 100 133 C 97 133, 94 130, 94 126 Z" fill="#FDE047"/>
    <ellipse cx="94" cy="128" rx="4.5" ry="3.5" fill="#FACC15"/>
    <ellipse cx="106" cy="128" rx="4.5" ry="3.5" fill="#FACC15"/>

    <!-- Bottom volume tag -->
    <rect x="74" y="152" width="52" height="14" rx="3" fill="#1E40AF"/>
    <text x="100" y="162" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#FFFFFF" text-anchor="middle">ORIGINAL • 250 ml</text>

    <!-- Side highlight crease -->
    <line x1="72" y1="53" x2="72" y2="173" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>

